name: Build Waveshare LED Display

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            cmake \
            git \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libusb-1.0-0-dev

      - name: Cache Pico SDK
        id: cache-pico-sdk
        uses: actions/cache@v6
        with:
          path: .pico-sdk
          key: ${{ runner.os }}-pico-sdk-2.2.0

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-pico2-${{ hashFiles('CMakeLists.txt', 'common/CMakeLists.txt', 'libraries/CMakeLists.txt', 'src/**', 'examples/**', 'common/**', 'libraries/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-pico2-

      - name: Checkout Pico SDK (with submodules)
        if: steps.cache-pico-sdk.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch 2.2.0 --recurse-submodules https://github.com/raspberrypi/pico-sdk.git "$GITHUB_WORKSPACE/.pico-sdk"

      - name: Configure CMake
        env:
          CCACHE_DIR: ~/.ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPICO_BOARD=pico2 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DPICO_SDK_PATH="$GITHUB_WORKSPACE/.pico-sdk"

      - name: Build
        run: cmake --build build-ci --parallel

      - name: ccache stats
        run: ccache --show-stats

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hub75-pico2
          path: |
            build-ci/*.uf2
            build-ci/*.elf
            build-ci/*.bin
          if-no-files-found: error
